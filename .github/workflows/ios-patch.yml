# Garden of Words iOS: Shorebird patch (over-the-air game update, no App Store review).
# Start it manually (Actions > iOS Patch (Shorebird) > Run workflow) or push a tag named patch-*:
#   git tag patch-2026-11-06 && git push origin patch-2026-11-06
# A tag push patches the most recent Shorebird release on the stable track.
# Native/asset differences stop the patch; those need the release workflow instead.
#
# patch-native-* tags (or allow_native_diffs) accept a Podfile.lock-only
# difference, but only when a release-<version> tag exists for the installed
# release and ios/, android/, pubspec.yaml and pubspec.lock are byte-identical
# to it. That covers CocoaPods rewriting the lock on a different runner, never
# real native changes.
name: iOS Patch (Shorebird)

on:
  push:
    tags:
      - "patch-*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Patch edilecek Shorebird release'i (örn. 1.1.30+34) ya da latest"
        type: string
        default: latest
      track:
        description: "stable kullanıcılara gider; staging sadece test içindir"
        type: choice
        default: stable
        options:
          - stable
          - staging
      allow_native_diffs:
        description: "Sadece release-<sürüm> etiketinden beri native dosyalar aynıysa Podfile.lock farkını kabul et"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  BUNDLE_ID: com.grkmcomert.gardenofwords
  FLUTTER_VERSION: "3.47.2"

jobs:
  patch:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PATCH_RELEASE_VERSION: ${{ inputs.release_version || 'latest' }}
      PATCH_TRACK: ${{ inputs.track || 'stable' }}
      ALLOW_NATIVE_DIFFS: ${{ inputs.allow_native_diffs || startsWith(github.ref_name, 'patch-native-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check inputs and secrets
        run: |
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY SHOREBIRD_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::$v secret eksik"; missing=1; fi
          done
          if [ "$PATCH_RELEASE_VERSION" != "latest" ] && [[ ! "$PATCH_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::release_version 'latest' ya da 1.1.30+34 biçiminde olmalı"; missing=1
          fi
          case "$PATCH_TRACK" in stable|staging) ;; *) echo "::error::Geçersiz track"; missing=1 ;; esac
          exit $missing

      - name: Native files unchanged since the release
        if: env.ALLOW_NATIVE_DIFFS == 'true'
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="release-$NAME"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::$TAG etiketi yok; native fark kabul edilmez"; exit 1; }
          if ! git diff --quiet "$TAG" HEAD -- ios android pubspec.yaml pubspec.lock; then
            echo "::error::$TAG etiketinden beri native dosyalar değişmiş; yeni release gerekir"
            git diff --stat "$TAG" HEAD -- ios android pubspec.yaml pubspec.lock
            exit 1
          fi
          echo "$TAG ile native dosyalar aynı; Podfile.lock farkı CocoaPods kaynaklı kabul edilecek."

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Shorebird and codemagic-cli-tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"
          pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools

      - name: Prepare Flutter and patchable game code
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          dart tooling/build_shorebird_game.dart
          flutter test test/shorebird_game_test.dart

      - name: Install CocoaPods dependencies (version from Podfile.lock)
        run: |
          V=$(grep '^COCOAPODS:' ios/Podfile.lock | awk '{print $2}')
          echo "CocoaPods $V"
          gem install cocoapods -v "$V" --no-document || sudo gem install cocoapods -v "$V" --no-document
          (cd ios && pod "_${V}_" install)
          git diff --stat -- ios/Podfile.lock || true
          git diff -- ios/Podfile.lock | head -60 || true

      - name: Code signing (App Store Connect API)
        run: |
          project_file="ios/Runner.xcodeproj/project.pbxproj"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$project_file" || { echo "Bundle ID uyuşmuyor"; exit 1; }
          perl -0pi -e 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = "1";/g' "$project_file"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --strict-match-identifier --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --custom-export-options='{"manageAppVersionAndBuildNumber":false}'

      - name: Shorebird iOS patch
        run: |
          shorebird releases list --platform=ios 2>/dev/null || true
          echo "Patch hedefi: $PATCH_RELEASE_VERSION, kanal: $PATCH_TRACK, native fark izni: $ALLOW_NATIVE_DIFFS"
          # Asset differences always fail; native ones only pass after the check above.
          EXTRA=()
          if [ "$ALLOW_NATIVE_DIFFS" = "true" ]; then EXTRA+=(--allow-native-diffs); fi
          shorebird patch ios \
            --release-version="$PATCH_RELEASE_VERSION" \
            --track="$PATCH_TRACK" \
            "${EXTRA[@]}" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Clean up keychain
        if: always()
        run: keychain use-login || true
